name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag and repository
        run: |
          python tools/validate.py
          python -m unittest discover -s tests -v
          test "${GITHUB_REF_NAME}" = "v$(python -m powerkit version)"
      - name: Build release artifacts
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python tools/package.py
          cd dist
          sha256sum *.whl *.zip > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/*.zip dist/SHA256SUMS --generate-notes --verify-tag
