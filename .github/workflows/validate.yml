name: validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills and adapters
        run: python tools/validate.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and install CLI distribution
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist/wheels
          python -m pip install --force-reinstall dist/wheels/*.whl
          powerkit --help
          powerkit version
          wheel_smoke="$(mktemp -d)"
          (cd "$wheel_smoke" && powerkit broker explain --effort FAST --risk NORMAL --platform codex --surface app --compact)
      - name: Agent onboarding smoke test
        run: |
          consumer="$(mktemp -d)"
          powerkit init --target "$consumer" --platforms codex,claude,copilot --yes
          powerkit status --target "$consumer" --json
          powerkit doctor --target "$consumer" --json
          powerkit sync --target "$consumer"
          powerkit uninstall --target "$consumer" --dry-run
      - name: Test hook guard
        run: python hooks/catastrophic_command_guard.py --self-test
      - name: Package
        run: python tools/package.py
