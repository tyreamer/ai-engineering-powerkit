name: validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills and adapters
        run: python tools/validate.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Test hook guard
        run: python hooks/catastrophic_command_guard.py --self-test
      - name: Package
        run: python tools/package.py
