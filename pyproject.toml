[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-powerkit"
version = "0.4.0"
description = "Agent-native engineering workflows, portable command routing, and deterministic bootstrap tooling for coding assistants"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "AI Engineering PowerKit contributors"}]
dependencies = []

[project.scripts]
powerkit = "powerkit.cli:main"

[project.urls]
Repository = "https://github.com/tyreamer/ai-engineering-powerkit"
Issues = "https://github.com/tyreamer/ai-engineering-powerkit/issues"

[tool.setuptools]
packages = ["powerkit"]
include-package-data = false

[tool.powerkit]
canonical_skill_root = ".agents/skills"
